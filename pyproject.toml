[project]
name = "tp3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fati", email = "fatimaezzahraamarzoug@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.5",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "session-info>=1.0.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
tp3 = "tp3:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
